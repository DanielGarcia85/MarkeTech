# .github/workflows/publish-images.yml
#
# GitHub Actions — builds the application images and publishes them
# ─────────────────────────────────────────────────────────────────────────────
# Runs on GitHub's own machines at every push. On "develop", the two images
# are only built, which checks that they still build. On "main", they are
# also published to the GitHub container registry (ghcr.io), where the
# production server fetches them.

name: Publish images

# Branches whose pushes start this workflow
on:
  push:
    branches:
      - develop
      - main

# Rights of the temporary token GitHub gives to this workflow: read the code,
# write to the container registry. Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build:
    # Virtual machine provided by GitHub, created for this run and then
    # destroyed
    runs-on: ubuntu-latest

    # The job runs twice, in parallel: once per image
    strategy:
      matrix:
        service:
          - backend
          - frontend

    # Every action is designated by the full identifier of a commit, with its
    # version in a comment: a version tag could be moved to other code.
    steps:
      # Copy the repository onto the virtual machine
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sign in to the registry with the temporary token of the workflow
      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Work out the name and the tags of the image: one tag made of the
      # commit, never reused, and "latest" for the most recent image of main
      - name: Compute the image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/danielgarcia85/marketech-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the image from the Dockerfile of the service. It is sent to
      # the registry only when the push was made on main.
      - name: Build the image, and publish it from main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # Do not attach the record of the build to the run as a downloadable
        # file: it is not used here
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
