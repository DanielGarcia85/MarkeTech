# .github/workflows/publish-images.yml
#
# GitHub Actions — tests the backend, builds the images and publishes them
# ─────────────────────────────────────────────────────────────────────────────
# Runs on GitHub's own machines at every push. First the backend tests: if one
# fails, nothing else runs. Then, on "develop", the two images are only built,
# which checks that they still build. On "main", they are also published to
# the GitHub container registry (ghcr.io), where the production server
# fetches them.

name: Test and publish images

# Branches whose pushes start this workflow
on:
  push:
    branches:
      - develop
      - main
    # A push that only changes documentation starts nothing: no tests, no
    # images, no deployment. A push that also touches anything else runs as
    # usual: GitHub skips the workflow only if every changed file is listed.
    paths-ignore:
      - "docs/**"
      - "backend/docs/**"
      - "frontend/docs/**"
      - "**.md"

# Rights of the temporary token GitHub gives to this workflow: read the code,
# write to the container registry. Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  test:
    # Virtual machine provided by GitHub, created for this run and then
    # destroyed
    runs-on: ubuntu-latest

    # What the tests need: the development settings (SQLite, nothing to
    # install) and a key that only lives for this run, not a secret
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: test-only-key-for-this-run

    # Every "run" step starts in the backend folder
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Python as the image and the workstations. pip's download cache
      # is kept from one run to the next, as long as requirements.txt does
      # not change.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the dependencies
        run: pip install --requirement requirements.txt

      # Django's system checks, then every test of every application. One
      # failure fails this step, this job, and so the whole workflow.
      - name: Run the tests
        run: python manage.py test --verbosity 2

  build:
    # Only once the tests have passed
    needs: test

    # Virtual machine provided by GitHub, created for this run and then
    # destroyed
    runs-on: ubuntu-latest

    # The job runs twice, in parallel: once per image
    strategy:
      matrix:
        service:
          - backend
          - frontend

    # Every action is designated by the full identifier of a commit, with its
    # version in a comment: a version tag could be moved to other code.
    steps:
      # Copy the repository onto the virtual machine
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sign in to the registry with the temporary token of the workflow
      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Work out the name and the tags of the image: one tag made of the
      # commit, never reused, and "latest" for the most recent image of main
      - name: Compute the image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/danielgarcia85/marketech-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the image from the Dockerfile of the service. It is sent to
      # the registry only when the push was made on main.
      - name: Build the image, and publish it from main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # Do not attach the record of the build to the run as a downloadable
        # file: it is not used here
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
