name: Deploy to VPS (main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Who am I
        run: |
          whoami
          id
          echo "HOME=$HOME"
          pwd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject prod .env into workspace
        run: |
          set -euo pipefail
          install -m 640 -g deploy /srv/apps/marketech/.env ./.env
          ls -la ./.env

      - name: Deploy
        run: |
          set -euo pipefail
          docker compose up -d --build
          docker compose ps
