# frontend/nginx.conf
#
# Nginx configuration — entry point of the application in Docker
# ─────────────────────────────────────────────────────────────────────────────
# Serves the compiled Vue application and passes everything that belongs to
# the backend on to the Django container.

server {
    # Port Nginx listens on inside the container
    listen 80;

    # Folder that holds the compiled Vue application
    root /usr/share/nginx/html;
    index index.html;

    # Vue application. A file that exists is served as is; any other address
    # gets index.html, so that the application can handle its own pages.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, authentication API (allauth), administration interface and their
    # static files: passed on to the backend container, reached by the name
    # of its Compose service. The address is matched with or without a final
    # slash: without it, Django itself redirects "/admin" to "/admin/".
    location ~ ^/(api|_allauth|admin|static)(/|$) {
        proxy_pass http://backend:8000;

        # Largest request body accepted: a file of the users is 5 MB at most
        # (backend/profiles/validators.py), plus the rest of the form. The
        # default, 1 MB, would refuse the upload with a 413 before Django
        # sees it.
        client_max_body_size 6m;

        # Host name and port typed by the visitor. Django compares them with
        # the origin of the forms it receives and rejects a mismatch.
        proxy_set_header Host $http_host;

        # Protocol and address of the visitor, as announced by the reverse
        # proxy placed in front of the application. Without that proxy, the
        # first header is empty and Nginx does not send it.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket of a logged-in user (backend/live): the same backend, but the
    # connection changes protocol and then stays open. Nginx passes on the
    # request to switch ("Upgrade"), which it drops by default, and keeps a
    # quiet connection for an hour instead of 60 seconds; a page whose
    # connection is cut opens a new one and reads everything again.
    location /ws/ {
        proxy_pass http://backend:8000;

        # The switch to WebSocket exists from HTTP 1.1 on: Nginx speaks 1.0
        # to the backend by default
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        # Same headers as above: the address typed by the visitor, and what
        # the reverse proxy announced
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
