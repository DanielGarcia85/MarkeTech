server {
    listen 80;
    server_name marketech.local;

    root /usr/share/nginx/html;
    index index.html;

    # Front - SPA (Vue) : routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Django
    location /api/ {
        proxy_pass http://marketech-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://marketech-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static collectstatic (volume)
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    # Media uploads (volume)
    location /media/ {
      alias /media/;
      access_log off;
      expires 30d;
    }
}
