<?xml version="1.0" encoding="UTF-8"?>
<!-- MarkeTech logo. Single colour: set `color` to recolour (currentColor). Wordmark: Poppins Bold outlines (OFL). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" color="#2d6f91" fill="currentColor" role="img" aria-label="MarkeTech">
<rect width="100" height="100" rx="20" fill="#2d6f91"/>
<g color="#fff" fill="currentColor">
<g transform="translate(10 10) scale(0.8)">
    <defs>
      <!-- Black shapes are cut out of the briefcase: the graduate is see-through -->
      <mask id="mt-icon-cut">
        <rect width="100" height="100" fill="#fff"/>
        <g fill="#000">
          <path d="M41 28 V23 A3 3 0 0 1 44 20 H56 A3 3 0 0 1 59 23 V28 Z"/>
          <path d="M21 42 L50 33 L79 42 L50 51 Z"/>
          <circle cx="50" cy="54" r="11.5"/>
          <rect x="77.9" y="42" width="2.2" height="10.5"/>
          <circle cx="79" cy="53.6" r="2.4"/>
          <path d="M25 90 V80 C25 72 32 69 40 69 H60 C68 69 75 72 75 80 V90 Z"/>
        </g>
      </mask>
      <clipPath id="mt-icon-head">
        <circle cx="50" cy="54" r="11.5"/>
      </clipPath>
    </defs>
    <!-- Briefcase: handle and body -->
    <g mask="url(#mt-icon-cut)">
      <rect x="35" y="14" width="30" height="20" rx="7"/>
      <rect x="6" y="28" width="88" height="66" rx="9"/>
    </g>
    <!-- Edge of the cap across the head, and the tie -->
    <path d="M21 42 L50 51 L79 42" fill="none" stroke="currentColor" stroke-width="2.2" clip-path="url(#mt-icon-head)"/>
    <path d="M50 69 L53.4 73 L51.6 84.5 L50 86.5 L48.4 84.5 L46.6 73 Z"/>
  </g>
</g>
</svg>
