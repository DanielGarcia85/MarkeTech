          <path d="M25 90 V80 C25 72 32 69 40 69 H60 C68 69 75 72 75 80 V90 Z"/>
        </g>
      </mask>
      <clipPath id="mt-logo-head">
        <circle cx="50" cy="54" r="11.5"/>
      </clipPath>
    </defs>
    <!-- Briefcase: handle and body -->
    <g mask="url(#mt-logo-cut)">
      <rect x="35" y="14" width="30" height="20" rx="7"/>
      <rect x="6" y="28" width="88" height="66" rx="9"/>
    </g>
