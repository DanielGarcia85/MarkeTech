<!doctype html>
<!--
  frontend/index.html

  Single page — the only HTML document of the application
  ───────────────────────────────────────────────────────────────────────────
  The browser loads this file once. Vue then builds the whole interface inside
  the "app" element, without loading another page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icon of the tab and bookmarks, served as is from the public folder -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MarkeTech</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
