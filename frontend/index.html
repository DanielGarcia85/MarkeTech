<!doctype html>
<!--
  frontend/index.html

  Single page — the only HTML document of the application
  ───────────────────────────────────────────────────────────────────────────
  The browser loads this file once. Vue then builds the whole interface inside
  the "app" element, without loading another page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons of the tab, bookmarks and home screens, served as is from the
         public folder: SVG for current browsers, ICO for the older ones, PNG
         for iOS, which ignores SVG icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MarkeTech</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
