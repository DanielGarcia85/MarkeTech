<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="MarkeTech in real time: how a message from Lea reaches Marc instantly, through the proxies, Daphne, Django, Channels, the channel layer and Redis">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8641e"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8323b"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <rect width="1500" height="1010" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#1b2a3a">MarkeTech in real time: the path of a message from Lea to Marc</text>
  <text x="30" y="68" font-size="14" fill="#555">Blue line: HTTP (one request, one answer, the connection closes). Orange line: WebSocket (the line stays open, the server speaks when it wants). Red line: the channel layer.</text>

  <!-- ── Browsers ───────────────────────────────────────────────── -->
  <rect x="30" y="140" width="210" height="120" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/>
  <text x="135" y="168" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Lea's browser</text>
  <text x="135" y="190" font-size="13" text-anchor="middle" fill="#333">candidate</text>
  <text x="135" y="214" font-size="13" text-anchor="middle" fill="#333">writes "Hello" in</text>
  <text x="135" y="232" font-size="13" text-anchor="middle" fill="#333">conversation no. 12</text>

  <rect x="30" y="560" width="210" height="160" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/>
  <text x="135" y="588" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Marc's browser</text>
  <text x="135" y="610" font-size="13" text-anchor="middle" fill="#333">employer, user no. 7</text>
  <text x="135" y="634" font-size="13" text-anchor="middle" fill="#333">his page is open:</text>
  <text x="135" y="652" font-size="13" text-anchor="middle" fill="#333">a WebSocket line</text>
  <text x="135" y="670" font-size="13" text-anchor="middle" fill="#333">wss://marketech.ch/ws/</text>
  <text x="135" y="694" font-size="13" text-anchor="middle" fill="#333">(frontend/src/live.ts)</text>

  <!-- ── VPS ────────────────────────────────────────────────────── -->
  <rect x="280" y="95" width="770" height="895" rx="14" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="120" font-size="14" font-weight="bold" fill="#555">Production server — Docker Compose containers</text>

  <!-- Proxies -->
  <rect x="300" y="140" width="130" height="600" rx="10" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="365" y="168" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">nginx</text>
  <text x="365" y="188" font-size="12" text-anchor="middle" fill="#333">two proxies:</text>
  <text x="365" y="206" font-size="12" text-anchor="middle" fill="#333">the server's</text>
  <text x="365" y="222" font-size="12" text-anchor="middle" fill="#333">(HTTPS), then</text>
  <text x="365" y="238" font-size="12" text-anchor="middle" fill="#333">the one in the</text>
  <text x="365" y="254" font-size="12" text-anchor="middle" fill="#333">frontend container</text>
  <text x="365" y="290" font-size="12" text-anchor="middle" fill="#333">Forward</text>
  <text x="365" y="306" font-size="12" text-anchor="middle" fill="#333">/api/ to Django</text>
  <text x="365" y="322" font-size="12" text-anchor="middle" fill="#333">and /ws/ with</text>
  <text x="365" y="338" font-size="12" text-anchor="middle" fill="#333">the header</text>
  <text x="365" y="354" font-size="12" text-anchor="middle" fill="#333">"Upgrade"</text>
  <text x="365" y="370" font-size="12" text-anchor="middle" fill="#333">without cutting</text>
  <text x="365" y="386" font-size="12" text-anchor="middle" fill="#333">the open line</text>

  <!-- Backend container -->
  <rect x="460" y="140" width="570" height="600" rx="12" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="480" y="164" font-size="14" font-weight="bold" fill="#1b2a3a">Backend container</text>

  <!-- Daphne -->
  <rect x="475" y="176" width="540" height="550" rx="12" fill="#f3eefa" stroke="#6b4aa0" stroke-width="2"/>
  <text x="495" y="200" font-size="16" font-weight="bold" fill="#4b2f80">Daphne — the application's web server (ASGI)</text>
  <text x="495" y="220" font-size="12.5" fill="#4b2f80">Speaks HTTP and WebSocket, keeps lines open, hands them to the Python code.</text>

  <!-- asgi router -->
  <rect x="495" y="236" width="500" height="58" rx="8" fill="#ffffff" stroke="#6b4aa0" stroke-width="1.5"/>
  <text x="745" y="259" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2a3a">config/asgi.py — the switch (ProtocolTypeRouter)</text>
  <text x="745" y="280" font-size="12.5" text-anchor="middle" fill="#333">HTTP → Django     ·     WebSocket on /ws/ → Channels (live/routing.py)</text>

  <!-- Django -->
  <rect x="495" y="320" width="235" height="235" rx="10" fill="#e8f2ea" stroke="#2e7d4f" stroke-width="2"/>
  <text x="612" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d5634">Django + DRF</text>
  <text x="612" y="366" font-size="12" text-anchor="middle" fill="#1d5634">the framework (handles HTTP)</text>
  <rect x="510" y="380" width="205" height="72" rx="6" fill="#ffffff" stroke="#2e7d4f"/>
  <text x="612" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b2a3a">a REST view</text>
  <text x="612" y="419" font-size="12" text-anchor="middle" fill="#333">messaging/views.py</text>
  <text x="612" y="438" font-size="12" text-anchor="middle" fill="#333">saves the message</text>
  <text x="612" y="480" font-size="12" text-anchor="middle" fill="#333">then calls</text>
  <text x="612" y="497" font-size="12" text-anchor="middle" fill="#333">live/notify.py:</text>
  <text x="612" y="514" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" fill="#b8323b">group_send("user_7",</text>
  <text x="612" y="531" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" fill="#b8323b">"messages")</text>

  <!-- Channels / consumer -->
  <rect x="760" y="320" width="235" height="235" rx="10" fill="#fdf1e6" stroke="#c8641e" stroke-width="2"/>
  <text x="877" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#8a4210">Channels</text>
  <text x="877" y="366" font-size="12" text-anchor="middle" fill="#8a4210">the extension (handles WebSockets)</text>
  <rect x="775" y="380" width="205" height="92" rx="6" fill="#ffffff" stroke="#c8641e"/>
  <text x="877" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Marc's consumer</text>
  <text x="877" y="419" font-size="12" text-anchor="middle" fill="#333">live/consumers.py</text>
  <text x="877" y="438" font-size="12" text-anchor="middle" fill="#333">the "view" of WebSockets:</text>
  <text x="877" y="456" font-size="12" text-anchor="middle" fill="#333">one object per open line</text>
  <text x="877" y="496" font-size="12" text-anchor="middle" fill="#333">on opening, subscribes:</text>
  <text x="877" y="514" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" fill="#b8323b">group_add("user_7")</text>
  <text x="877" y="538" font-size="12" text-anchor="middle" fill="#333">refuses an anonymous visitor</text>

  <!-- Channel layer -->
  <rect x="495" y="590" width="500" height="120" rx="10" fill="#fbecee" stroke="#b8323b" stroke-width="2"/>
  <text x="745" y="616" font-size="15" font-weight="bold" text-anchor="middle" fill="#8c1f27">Channel layer — the shared mailbox</text>
  <text x="745" y="638" font-size="12.5" text-anchor="middle" fill="#333">The Channels interface that links pieces of code</text>
  <text x="745" y="655" font-size="12.5" text-anchor="middle" fill="#333">that do not know each other: the view posts (group_send),</text>
  <text x="745" y="672" font-size="12.5" text-anchor="middle" fill="#333">the subscribed consumers receive (group_add). It hands</text>
  <text x="745" y="689" font-size="12.5" text-anchor="middle" fill="#333">the mail to Redis (package channels-redis).</text>
  <text x="745" y="705" font-size="11.5" text-anchor="middle" fill="#777">In development, on the workstation: in-memory version, no Redis.</text>

  <!-- PostgreSQL -->
  <rect x="300" y="800" width="230" height="160" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/>
  <text x="415" y="828" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">PostgreSQL container</text>
  <text x="415" y="852" font-size="12.5" text-anchor="middle" fill="#333">the database</text>
  <text x="415" y="874" font-size="12.5" text-anchor="middle" fill="#333">durable: accounts, offers,</text>
  <text x="415" y="892" font-size="12.5" text-anchor="middle" fill="#333">applications, messages…</text>
  <text x="415" y="920" font-size="12" text-anchor="middle" fill="#777">backed up every night</text>

  <!-- Redis -->
  <rect x="600" y="800" width="290" height="160" rx="10" fill="#fbecee" stroke="#b8323b" stroke-width="2"/>
  <text x="745" y="828" font-size="15" font-weight="bold" text-anchor="middle" fill="#8c1f27">Redis container</text>
  <text x="745" y="852" font-size="12.5" text-anchor="middle" fill="#333">in-memory store, very fast,</text>
  <text x="745" y="870" font-size="12.5" text-anchor="middle" fill="#333">that holds the mailbox:</text>
  <text x="745" y="888" font-size="12.5" text-anchor="middle" fill="#333">signals go through it in</text>
  <text x="745" y="906" font-size="12.5" text-anchor="middle" fill="#333">a few milliseconds</text>
  <text x="745" y="934" font-size="12" text-anchor="middle" fill="#777">nothing durable, nothing to back up</text>

  <!-- ── Arrows (flow) ─────────────────────────────────────────── -->
  <!-- 0: Marc opens WS (orange) -->
  <line x1="240" y1="600" x2="298" y2="600" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>
  <line x1="432" y1="282" x2="493" y2="282" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>
  <line x1="877" y1="296" x2="877" y2="318" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>

  <!-- 1: Léa POST (blue) -->
  <line x1="240" y1="200" x2="298" y2="200" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="432" y1="252" x2="493" y2="252" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="612" y1="296" x2="612" y2="318" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>

  <!-- 2: view -> PostgreSQL (grey) -->
  <polyline points="510,555 510,570 450,570 450,780 415,780 415,798" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#a-grey)"/>

  <!-- 3: group_send -> layer -> Redis (red) -->
  <line x1="640" y1="557" x2="640" y2="588" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>
  <line x1="700" y1="712" x2="700" y2="798" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>

  <!-- 4: Redis -> layer -> consumer (red) -->
  <line x1="790" y1="798" x2="790" y2="714" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>
  <line x1="877" y1="588" x2="877" y2="558" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>

  <!-- 5: consumer -> Marc via WS (orange) -->
  <polyline points="997,500 1040,500 1040,760 270,760 270,690 242,690" fill="none" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>

  <!-- 6: Marc reloads via HTTP (blue) -->
  <polyline points="240,650 298,650" fill="none" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>

  <!-- Step badges -->
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="268" cy="583" r="12" fill="#c8641e"/><text x="268" y="588">0</text>
    <circle cx="268" cy="183" r="12" fill="#1f5f8b"/><text x="268" y="188">1</text>
    <circle cx="450" cy="660" r="12" fill="#555"/><text x="450" y="665">2</text>
    <circle cx="622" cy="572" r="12" fill="#b8323b"/><text x="622" y="577">3</text>
    <circle cx="683" cy="755" r="12" fill="#b8323b"/><text x="683" y="760">3</text>
    <circle cx="808" cy="755" r="12" fill="#b8323b"/><text x="808" y="760">4</text>
    <circle cx="895" cy="572" r="12" fill="#b8323b"/><text x="895" y="577">4</text>
    <circle cx="1040" cy="625" r="12" fill="#c8641e"/><text x="1040" y="630">5</text>
    <circle cx="268" cy="633" r="12" fill="#1f5f8b"/><text x="268" y="638">6</text>
  </g>

  <!-- ── Right panel: the steps ──────────────────────────────────── -->
  <rect x="1070" y="95" width="400" height="430" rx="12" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="1090" y="124" font-size="16" font-weight="bold" fill="#1b2a3a">The steps</text>
  <g font-size="12.5" fill="#333">
    <text x="1090" y="152"><tspan font-weight="bold" fill="#c8641e">0</tspan>  Marc opens a page: his browser opens</text>
    <text x="1108" y="169">the WebSocket line; the consumer accepts it and</text>
    <text x="1108" y="186">subscribes to group user_7. The line stays open.</text>
    <text x="1090" y="214"><tspan font-weight="bold" fill="#1f5f8b">1</tspan>  Lea sends her message: an ordinary HTTP</text>
    <text x="1108" y="231">request (POST /api/applications/12/messages/).</text>
    <text x="1090" y="259"><tspan font-weight="bold" fill="#555">2</tspan>  The view checks it and saves it in the database.</text>
    <text x="1090" y="287"><tspan font-weight="bold" fill="#b8323b">3</tspan>  Once saved, the view posts a signal</text>
    <text x="1108" y="304">"messages, conversation 12" for the groups</text>
    <text x="1108" y="321">of Marc (user_7) and of Lea: the channel layer</text><text x="1108" y="338">hands it to Redis.</text>
    <text x="1090" y="359"><tspan font-weight="bold" fill="#b8323b">4</tspan>  Redis delivers it to every subscriber of the group:</text>
    <text x="1108" y="376">the consumer of each tab Marc has open.</text>
    <text x="1090" y="404"><tspan font-weight="bold" fill="#c8641e">5</tspan>  The consumer sends it down the open line:</text>
    <text x="1108" y="421" font-family="DejaVu Sans Mono, monospace" font-size="12">{"type":"messages","application":12}</text>
    <text x="1090" y="449"><tspan font-weight="bold" fill="#1f5f8b">6</tspan>  Marc's page reloads the conversation through</text>
    <text x="1108" y="466">the usual API (GET): the API alone decides</text>
    <text x="1108" y="483">what Marc is allowed to see.</text>
    <text x="1090" y="515" font-weight="bold" fill="#1b2a3a">From 1 to 6: less than a second.</text>
  </g>

  <!-- ── Right panel: who does what ─────────────────────────────── -->
  <rect x="1070" y="545" width="400" height="445" rx="12" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="1090" y="574" font-size="16" font-weight="bold" fill="#1b2a3a">Who does what</text>
  <g font-size="12.5" fill="#333">
    <text x="1090" y="602" font-weight="bold" fill="#4b2f80">Daphne: the application's web server</text>
    <text x="1090" y="619">Speaks HTTP and WebSocket on port 8000, behind</text>
    <text x="1090" y="636">nginx, which handles HTTPS and the frontend pages.</text>
    <text x="1090" y="662" font-weight="bold" fill="#1d5634">Django (+ DRF): the framework</text>
    <text x="1090" y="679">What the site does: models, database, views, API.</text>
    <text x="1090" y="696">Daphne and Django complement each other: one carries,</text>
    <text x="1090" y="713">the other decides. Neither replaces the other.</text>
    <text x="1090" y="738" font-weight="bold" fill="#8a4210">Channels: an extension of Django</text>
    <text x="1090" y="755">A library that adds WebSockets to Django,</text>
    <text x="1090" y="772">with its accounts, sessions and settings.</text>
    <text x="1090" y="796" font-weight="bold" fill="#8a4210">Consumer: the "view" of WebSockets</text>
    <text x="1090" y="813">Handles one open line, from opening to closing.</text>
    <text x="1090" y="837" font-weight="bold" fill="#8c1f27">Channel layer: the mailbox (interface)</text>
    <text x="1090" y="854">Links the view and the consumers, strangers to each other.</text>
    <text x="1090" y="878" font-weight="bold" fill="#8c1f27">Redis: the program that holds it</text>
    <text x="1090" y="895">Keeps the mail from posting to delivery; channels-redis</text>
    <text x="1090" y="912">is the connector between the channel layer and Redis.</text>
    <text x="1090" y="940" font-weight="bold" fill="#1f5f8b">Why not without all this?</text>
    <text x="1090" y="957">HTTP alone does not let the server speak</text>
    <text x="1090" y="974">first: before, the page polled every 10 s.</text>
  </g>
</svg>
