<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="MarkeTech en temps réel : comment un message de Léa arrive instantanément chez Marc, à travers les proxys, Daphne, Django, Channels, la channel layer et Redis">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8641e"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8323b"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <rect width="1500" height="1010" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#1b2a3a">MarkeTech en temps réel : le trajet d'un message de Léa jusqu'à Marc</text>
  <text x="30" y="68" font-size="14" fill="#555">Trait bleu : HTTP (une question, une réponse, la connexion se ferme). Trait orange : WebSocket (la ligne reste ouverte, le serveur parle quand il veut). Trait rouge : la channel layer.</text>

  <!-- ── Browsers ───────────────────────────────────────────────── -->
  <rect x="30" y="140" width="210" height="120" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/>
  <text x="135" y="168" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Navigateur de Léa</text>
  <text x="135" y="190" font-size="13" text-anchor="middle" fill="#333">candidate</text>
  <text x="135" y="214" font-size="13" text-anchor="middle" fill="#333">écrit « Bonjour » dans</text>
  <text x="135" y="232" font-size="13" text-anchor="middle" fill="#333">la conversation n° 12</text>

  <rect x="30" y="560" width="210" height="160" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/>
  <text x="135" y="588" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Navigateur de Marc</text>
  <text x="135" y="610" font-size="13" text-anchor="middle" fill="#333">employeur, utilisateur n° 7</text>
  <text x="135" y="634" font-size="13" text-anchor="middle" fill="#333">sa page est ouverte :</text>
  <text x="135" y="652" font-size="13" text-anchor="middle" fill="#333">une ligne WebSocket</text>
  <text x="135" y="670" font-size="13" text-anchor="middle" fill="#333">wss://marketech.ch/ws/</text>
  <text x="135" y="694" font-size="13" text-anchor="middle" fill="#333">(frontend/src/live.ts)</text>

  <!-- ── VPS ────────────────────────────────────────────────────── -->
  <rect x="280" y="95" width="770" height="895" rx="14" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="120" font-size="14" font-weight="bold" fill="#555">Serveur VPS — conteneurs Docker Compose</text>

  <!-- Proxies -->
  <rect x="300" y="140" width="130" height="600" rx="10" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="365" y="168" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">nginx</text>
  <text x="365" y="188" font-size="12" text-anchor="middle" fill="#333">deux proxys :</text>
  <text x="365" y="206" font-size="12" text-anchor="middle" fill="#333">celui du VPS</text>
  <text x="365" y="222" font-size="12" text-anchor="middle" fill="#333">(HTTPS), puis</text>
  <text x="365" y="238" font-size="12" text-anchor="middle" fill="#333">celui du conteneur</text>
  <text x="365" y="254" font-size="12" text-anchor="middle" fill="#333">frontend</text>
  <text x="365" y="290" font-size="12" text-anchor="middle" fill="#333">Font suivre</text>
  <text x="365" y="306" font-size="12" text-anchor="middle" fill="#333">/api/ vers Django</text>
  <text x="365" y="322" font-size="12" text-anchor="middle" fill="#333">et /ws/ avec</text>
  <text x="365" y="338" font-size="12" text-anchor="middle" fill="#333">l'en-tête</text>
  <text x="365" y="354" font-size="12" text-anchor="middle" fill="#333">« Upgrade »</text>
  <text x="365" y="370" font-size="12" text-anchor="middle" fill="#333">sans couper la</text>
  <text x="365" y="386" font-size="12" text-anchor="middle" fill="#333">ligne ouverte</text>

  <!-- Backend container -->
  <rect x="460" y="140" width="570" height="600" rx="12" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="480" y="164" font-size="14" font-weight="bold" fill="#1b2a3a">Conteneur backend</text>

  <!-- Daphne -->
  <rect x="475" y="176" width="540" height="550" rx="12" fill="#f3eefa" stroke="#6b4aa0" stroke-width="2"/>
  <text x="495" y="200" font-size="16" font-weight="bold" fill="#4b2f80">Daphne — le serveur web de l'application (ASGI)</text>
  <text x="495" y="220" font-size="12.5" fill="#4b2f80">Parle HTTP et WebSocket, garde les lignes ouvertes, les confie au code Python.</text>

  <!-- asgi router -->
  <rect x="495" y="236" width="500" height="58" rx="8" fill="#ffffff" stroke="#6b4aa0" stroke-width="1.5"/>
  <text x="745" y="259" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2a3a">config/asgi.py — l'aiguillage (ProtocolTypeRouter)</text>
  <text x="745" y="280" font-size="12.5" text-anchor="middle" fill="#333">HTTP → Django     ·     WebSocket sur /ws/ → Channels (live/routing.py)</text>

  <!-- Django -->
  <rect x="495" y="320" width="235" height="235" rx="10" fill="#e8f2ea" stroke="#2e7d4f" stroke-width="2"/>
  <text x="612" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d5634">Django + DRF</text>
  <text x="612" y="366" font-size="12" text-anchor="middle" fill="#1d5634">le framework (traite le HTTP)</text>
  <rect x="510" y="380" width="205" height="72" rx="6" fill="#ffffff" stroke="#2e7d4f"/>
  <text x="612" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b2a3a">une vue REST</text>
  <text x="612" y="419" font-size="12" text-anchor="middle" fill="#333">messaging/views.py</text>
  <text x="612" y="438" font-size="12" text-anchor="middle" fill="#333">enregistre le message</text>
  <text x="612" y="480" font-size="12" text-anchor="middle" fill="#333">puis appelle</text>
  <text x="612" y="497" font-size="12" text-anchor="middle" fill="#333">live/notify.py :</text>
  <text x="612" y="514" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" fill="#b8323b">group_send("user_7",</text>
  <text x="612" y="531" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" fill="#b8323b">"messages")</text>

  <!-- Channels / consumer -->
  <rect x="760" y="320" width="235" height="235" rx="10" fill="#fdf1e6" stroke="#c8641e" stroke-width="2"/>
  <text x="877" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#8a4210">Channels</text>
  <text x="877" y="366" font-size="12" text-anchor="middle" fill="#8a4210">l'extension (traite les WebSockets)</text>
  <rect x="775" y="380" width="205" height="92" rx="6" fill="#ffffff" stroke="#c8641e"/>
  <text x="877" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b2a3a">le consumer de Marc</text>
  <text x="877" y="419" font-size="12" text-anchor="middle" fill="#333">live/consumers.py</text>
  <text x="877" y="438" font-size="12" text-anchor="middle" fill="#333">la « vue » des WebSockets :</text>
  <text x="877" y="456" font-size="12" text-anchor="middle" fill="#333">un objet par ligne ouverte</text>
  <text x="877" y="496" font-size="12" text-anchor="middle" fill="#333">à l'ouverture, s'abonne :</text>
  <text x="877" y="514" font-size="12" font-family="DejaVu Sans Mono, monospace" text-anchor="middle" fill="#b8323b">group_add("user_7")</text>
  <text x="877" y="538" font-size="12" text-anchor="middle" fill="#333">refuse un visiteur anonyme</text>

  <!-- Channel layer -->
  <rect x="495" y="590" width="500" height="120" rx="10" fill="#fbecee" stroke="#b8323b" stroke-width="2"/>
  <text x="745" y="616" font-size="15" font-weight="bold" text-anchor="middle" fill="#8c1f27">Channel layer — la boîte aux lettres partagée</text>
  <text x="745" y="638" font-size="12.5" text-anchor="middle" fill="#333">L'interface de Channels qui relie des morceaux de code</text>
  <text x="745" y="655" font-size="12.5" text-anchor="middle" fill="#333">qui ne se connaissent pas : la vue dépose (group_send),</text>
  <text x="745" y="672" font-size="12.5" text-anchor="middle" fill="#333">les consumers abonnés reçoivent (group_add). Elle confie</text>
  <text x="745" y="689" font-size="12.5" text-anchor="middle" fill="#333">le courrier à Redis (paquet channels-redis).</text>
  <text x="745" y="705" font-size="11.5" text-anchor="middle" fill="#777">En développement, sur le poste : version en mémoire, sans Redis.</text>

  <!-- PostgreSQL -->
  <rect x="300" y="800" width="230" height="160" rx="10" fill="#eef4fa" stroke="#1f5f8b" stroke-width="2"/>
  <text x="415" y="828" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Conteneur PostgreSQL</text>
  <text x="415" y="852" font-size="12.5" text-anchor="middle" fill="#333">la base de données</text>
  <text x="415" y="874" font-size="12.5" text-anchor="middle" fill="#333">durable : comptes, offres,</text>
  <text x="415" y="892" font-size="12.5" text-anchor="middle" fill="#333">candidatures, messages…</text>
  <text x="415" y="920" font-size="12" text-anchor="middle" fill="#777">sauvegardée chaque nuit</text>

  <!-- Redis -->
  <rect x="600" y="800" width="290" height="160" rx="10" fill="#fbecee" stroke="#b8323b" stroke-width="2"/>
  <text x="745" y="828" font-size="15" font-weight="bold" text-anchor="middle" fill="#8c1f27">Conteneur Redis</text>
  <text x="745" y="852" font-size="12.5" text-anchor="middle" fill="#333">base en mémoire, très rapide,</text>
  <text x="745" y="870" font-size="12.5" text-anchor="middle" fill="#333">qui tient la boîte aux lettres :</text>
  <text x="745" y="888" font-size="12.5" text-anchor="middle" fill="#333">les signaux y passent en</text>
  <text x="745" y="906" font-size="12.5" text-anchor="middle" fill="#333">quelques millisecondes</text>
  <text x="745" y="934" font-size="12" text-anchor="middle" fill="#777">rien de durable, rien à sauvegarder</text>

  <!-- ── Arrows (flow) ─────────────────────────────────────────── -->
  <!-- 0: Marc opens WS (orange) -->
  <line x1="240" y1="600" x2="298" y2="600" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>
  <line x1="432" y1="282" x2="493" y2="282" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>
  <line x1="877" y1="296" x2="877" y2="318" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>

  <!-- 1: Léa POST (blue) -->
  <line x1="240" y1="200" x2="298" y2="200" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="432" y1="252" x2="493" y2="252" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="612" y1="296" x2="612" y2="318" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>

  <!-- 2: view -> PostgreSQL (grey) -->
  <polyline points="510,555 510,570 450,570 450,780 415,780 415,798" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#a-grey)"/>

  <!-- 3: group_send -> layer -> Redis (red) -->
  <line x1="640" y1="557" x2="640" y2="588" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>
  <line x1="700" y1="712" x2="700" y2="798" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>

  <!-- 4: Redis -> layer -> consumer (red) -->
  <line x1="790" y1="798" x2="790" y2="714" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>
  <line x1="877" y1="588" x2="877" y2="558" stroke="#b8323b" stroke-width="3" marker-end="url(#a-red)"/>

  <!-- 5: consumer -> Marc via WS (orange) -->
  <polyline points="997,500 1040,500 1040,760 270,760 270,690 242,690" fill="none" stroke="#c8641e" stroke-width="3" marker-end="url(#a-orange)"/>

  <!-- 6: Marc reloads via HTTP (blue) -->
  <polyline points="240,650 298,650" fill="none" stroke="#1f5f8b" stroke-width="3" marker-end="url(#a-blue)"/>

  <!-- Step badges -->
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="268" cy="583" r="12" fill="#c8641e"/><text x="268" y="588">0</text>
    <circle cx="268" cy="183" r="12" fill="#1f5f8b"/><text x="268" y="188">1</text>
    <circle cx="450" cy="660" r="12" fill="#555"/><text x="450" y="665">2</text>
    <circle cx="622" cy="572" r="12" fill="#b8323b"/><text x="622" y="577">3</text>
    <circle cx="683" cy="755" r="12" fill="#b8323b"/><text x="683" y="760">3</text>
    <circle cx="808" cy="755" r="12" fill="#b8323b"/><text x="808" y="760">4</text>
    <circle cx="895" cy="572" r="12" fill="#b8323b"/><text x="895" y="577">4</text>
    <circle cx="1040" cy="625" r="12" fill="#c8641e"/><text x="1040" y="630">5</text>
    <circle cx="268" cy="633" r="12" fill="#1f5f8b"/><text x="268" y="638">6</text>
  </g>

  <!-- ── Right panel: the steps ──────────────────────────────────── -->
  <rect x="1070" y="95" width="400" height="430" rx="12" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="1090" y="124" font-size="16" font-weight="bold" fill="#1b2a3a">Les étapes</text>
  <g font-size="12.5" fill="#333">
    <text x="1090" y="152"><tspan font-weight="bold" fill="#c8641e">0</tspan>  Marc ouvre une page : son navigateur ouvre</text>
    <text x="1108" y="169">la ligne WebSocket ; le consumer l'accepte et</text>
    <text x="1108" y="186">s'abonne au groupe user_7. La ligne reste ouverte.</text>
    <text x="1090" y="214"><tspan font-weight="bold" fill="#1f5f8b">1</tspan>  Léa envoie son message : une requête HTTP</text>
    <text x="1108" y="231">ordinaire (POST /api/applications/12/messages/).</text>
    <text x="1090" y="259"><tspan font-weight="bold" fill="#555">2</tspan>  La vue le vérifie et l'enregistre en base.</text>
    <text x="1090" y="287"><tspan font-weight="bold" fill="#b8323b">3</tspan>  Une fois enregistré, la vue dépose un signal</text>
    <text x="1108" y="304">« messages, conversation 12 » pour le groupe</text>
    <text x="1108" y="321">user_7 : la channel layer le confie à Redis.</text>
    <text x="1090" y="349"><tspan font-weight="bold" fill="#b8323b">4</tspan>  Redis le remet à tous les abonnés du groupe :</text>
    <text x="1108" y="366">le consumer de chaque onglet ouvert par Marc.</text>
    <text x="1090" y="394"><tspan font-weight="bold" fill="#c8641e">5</tspan>  Le consumer l'envoie par la ligne ouverte :</text>
    <text x="1108" y="411" font-family="DejaVu Sans Mono, monospace" font-size="12">{"type":"messages","application":12}</text>
    <text x="1090" y="439"><tspan font-weight="bold" fill="#1f5f8b">6</tspan>  La page de Marc relit la conversation par</text>
    <text x="1108" y="456">l'API habituelle (GET) : l'API reste seule juge</text>
    <text x="1108" y="473">de ce que Marc a le droit de voir.</text>
    <text x="1090" y="505" font-weight="bold" fill="#1b2a3a">Durée de 1 à 6 : moins d'une seconde.</text>
  </g>

  <!-- ── Right panel: who does what ─────────────────────────────── -->
  <rect x="1070" y="545" width="400" height="445" rx="12" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="1090" y="574" font-size="16" font-weight="bold" fill="#1b2a3a">Qui fait quoi</text>
  <g font-size="12.5" fill="#333">
    <text x="1090" y="602" font-weight="bold" fill="#4b2f80">Daphne : le serveur web de l'application</text>
    <text x="1090" y="619">Parle HTTP et WebSocket sur le port 8000, derrière</text>
    <text x="1090" y="636">nginx, qui gère le HTTPS et les pages du frontend.</text>
    <text x="1090" y="662" font-weight="bold" fill="#1d5634">Django (+ DRF) : le framework</text>
    <text x="1090" y="679">Ce que fait le site : modèles, base, vues, API.</text>
    <text x="1090" y="696">Daphne et Django se complètent : l'un transporte,</text>
    <text x="1090" y="713">l'autre décide. Aucun ne remplace l'autre.</text>
    <text x="1090" y="738" font-weight="bold" fill="#8a4210">Channels : une extension de Django</text>
    <text x="1090" y="755">Une bibliothèque qui ajoute les WebSockets à Django,</text>
    <text x="1090" y="772">avec ses comptes, ses sessions et ses réglages.</text>
    <text x="1090" y="796" font-weight="bold" fill="#8a4210">Consumer : la « vue » des WebSockets</text>
    <text x="1090" y="813">Gère une ligne ouverte, de l'ouverture à la fermeture.</text>
    <text x="1090" y="837" font-weight="bold" fill="#8c1f27">Channel layer : la boîte aux lettres (interface)</text>
    <text x="1090" y="854">Relie la vue et les consumers, qui ne se connaissent pas.</text>
    <text x="1090" y="878" font-weight="bold" fill="#8c1f27">Redis : le programme qui la tient</text>
    <text x="1090" y="895">Garde le courrier entre dépôt et remise ; channels-redis</text>
    <text x="1090" y="912">est le connecteur entre la channel layer et Redis.</text>
    <text x="1090" y="940" font-weight="bold" fill="#1f5f8b">Pourquoi pas sans tout ça ?</text>
    <text x="1090" y="957">HTTP seul ne permet pas au serveur de parler en</text>
    <text x="1090" y="974">premier : avant, la page redemandait toutes les 10 s.</text>
  </g>
</svg>
