server {
    listen 80;
    server_name marketech.local;

    # Front (SPA)
    location / {
        proxy_pass http://marketech-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Django
    location /api/ {
        proxy_pass http://marketech-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://marketech-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static collectstatic (volume)
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    # Media uploads (volume)
    location /media/ {
      alias /media/;
      access_log off;
      expires 30d;
    }
}
